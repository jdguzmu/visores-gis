<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Comparador Cartográfico CHMS</title>
  <link rel="stylesheet" href="https://js.arcgis.com/5.1/esri/themes/light/main.css">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="app-shell">
    <header class="toolbar">
      <div class="brand"><h1>Comparador Cartográfico CHMS</h1><span id="connection-status" class="status disconnected">○ Sin conexión con el visor principal</span></div>
      <div class="controls">
        <label class="basemap-control" for="basemap-select">Mapa base:<select id="basemap-select" aria-label="Mapa base"></select></label>
        <label class="sync-control"><input id="sync-toggle" type="checkbox" checked> Sincronizar con visor principal</label>
        <button id="reset-view" type="button">Volver a vista inicial</button>
      </div>
      <div id="error-message" class="error" role="alert" hidden></div>
    </header>
    <section class="map-region" aria-label="Mapa comparador"><div id="viewDiv"></div><div class="map-info"><span id="active-basemap"></span><span id="scale"></span></div></section>
  </main>
  <script src="https://js.arcgis.com/5.1/"></script>
  <script type="module" src="./main.js"></script>
</body>
</html>
