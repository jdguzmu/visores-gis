<div>
  <div style="height: 30px;">
    <span id="spanCapaStyle" style="margin-right: 5%">Capa:</span>

    <select id="selectCapaStyle" style="width:75%;height:30px;float: initial;" required data-dojo-attach-point="selectCapaStyle">
		 <option value="-1" selected="true" disabled="disabled">Seleccione capa</option>
		 </select>
  </div>
  <div data-dojo-attach-point="subCapa_Node" style="height:30px;padding-top:2px">
    <span id="spanSubCapaStyle" style="margin-right: 5%;visibility:hidden;">${nls.selectSubCapaStyle}:</span>
    <select id="selectSubCapaStyle" data-dojo-attach-point="selectSubCapaStyle" data-dojo-type="dijit/form/Select" class="selectSubCapaStyle jimu-float-trailing" style="width:50%;height:30px;visibility:hidden;float: initial;">Seleccione nivel</select>
  </div>

  <label>${nls.selectDrawMode}</label>
  <div data-dojo-attach-point="drawBox" data-dojo-type="jimu/dijit/DrawBox" data-dojo-props='types:["point","polyline","polygon","text"],showClear:false,deactivateAfterDrawing:false' style="margin-top:5px;"></div>

  <div data-dojo-attach-point="settingContent" style="width:100%;">

    <div class="point-section" data-dojo-attach-point="pointSection">
      <div data-dojo-attach-point="pointSymChooser" data-dojo-type="jimu/dijit/SymbolChooser" data-dojo-props='type:"marker"'></div>
    </div>

    <div class="line-section" data-dojo-attach-point="lineSection">
      <div data-dojo-attach-point="lineSymChooser" data-dojo-type="jimu/dijit/SymbolChooser" data-dojo-props='type:"line"'></div>
    </div>

    <div class="polygon-section" data-dojo-attach-point="polygonSection">
      <div data-dojo-attach-point="fillSymChooser" data-dojo-type="jimu/dijit/SymbolChooser" data-dojo-props='type:"fill"'></div>
    </div>

    <div class="text-section" data-dojo-attach-point="textSection">
      <div data-dojo-attach-point="textSymChooser" data-dojo-type="jimu/dijit/SymbolChooser" data-dojo-props='type:"text"'></div>
    </div>
    <div class="text-section" data-dojo-attach-point="complexSection">
      <div class="labelComplexStyle"><label>Estilo de Punto</label></div>
      <div data-dojo-attach-point="pointSymChooserComplex" data-dojo-type="jimu/dijit/SymbolChooser" data-dojo-props='type:"marker"'></div>
      <div class="labelComplexStyle"><label>Estilo de Línea</label></div>
      <div data-dojo-attach-point="lineSymChooserComplex" data-dojo-type="jimu/dijit/SymbolChooser" data-dojo-props='type:"line"'></div>
      <div class="labelComplexStyle"><label>Estilo de Área</label></div>
      <div data-dojo-attach-point="fillSymChooserComplex" data-dojo-type="jimu/dijit/SymbolChooser" data-dojo-props='type:"fill"'></div>
    </div>
  </div>

  <div data-dojo-attach-point="measureSection" class="measure-section">
    <div style="margin-bottom:7px;">
      <input data-dojo-attach-point="showMeasure" type="checkbox" />
      <label data-dojo-attach-point="showMeasureLabel">${nls.showMeasurements}</label>
    </div>
    <div data-dojo-attach-point="areaMeasure" style="display:none;height:30px;margin-bottom:7px;">
      <div class="area-units-tip  jimu-float-leading">${nls.areaUnits}</div>
      <select data-dojo-attach-point="areaUnitSelect" data-dojo-type="dijit/form/Select" class=" jimu-float-trailing" style="width:50%;height:30px;"></select>
    </div>
    <div data-dojo-attach-point="distanceMeasure" style="display:none;height:30px;">
      <div class="distance-units-tip jimu-float-leading">${nls.distanceUnits}</div>
      <select data-dojo-attach-point="distanceUnitSelect" data-dojo-type="dijit/form/Select" class=" jimu-float-trailing" style="width:50%;height:30px;"></select>
    </div>
  </div>

  <div class="operations" onselectstart="return false;">
    <div class="jimu-btn" data-dojo-attach-point="btnUndo" data-dojo-attach-event="onclick:_onBtnUndoClicked" style="display:none">${nls.undo}</div>
    <div class="jimu-btn" data-dojo-attach-point="btnRedo" data-dojo-attach-event="onclick:_onBtnRedoClicked" style="display:none">${nls.redo}</div>
    <div class="jimu-btn last-btn" data-dojo-attach-point="btnClear" data-dojo-attach-event="onclick:_onBtnClearClicked" style="display:none">${nls.clear}</div>
  </div>
  
  <div id="divEtiquetado" style="display: none">
	<div style="height: 70px">
		<div style="height:25px; margin-bottom: 10px; text-align:center; background-color:#d3d9dec2; border:solid; border-color:darkgray; border-width:1px"> <span id="spanEtiquetadoStyle" style="margin-right: 5%; vertical-align:middle">Rotular campos</span></div>
		<span id="spanEtiquetadoStyle" style="margin-right: 5%">Campo:</span>

		<select id="selectCampo" style="width:75%;height:30px;float: initial;" required data-dojo-attach-point="selectCampo">
		 <option value="-1" selected="true" disabled="disabled">Seleccione campo</option>
		 </select>
	</div>
	<div data-dojo-attach-point="settingContent2" style="width:100%;">
		<div class="text-section2" data-dojo-attach-point="textSection2">
			<div data-dojo-attach-point="textSymChooser2" data-dojo-type="jimu/dijit/SymbolChooser" data-dojo-props='type:"text"'></div>

			<span id="spanTipoLetra" style="margin-right: 34px;">Tipo de fuente:</span>
			<select id="selectTipoLetra" style="width:140px;height:30px;float: initial;" required data-dojo-attach-point="selectTipoLetra" data-dojo-attach-event="onChange:actualizarPreview">
			</select>
			<button id="bNegrita" title="Negrita" data-dojo-type="dijit/form/ToggleButton" data-dojo-attach-point="bNegrita" data-dojo-attach-event="onChange:actualizarPreview"><b>N</b></button>
			<button id="bCursiva" title="Cursiva" data-dojo-type="dijit/form/ToggleButton" data-dojo-attach-point="bCursiva" data-dojo-attach-event="onChange:actualizarPreview"><i>C</i></button>
			<button id="bSubr" title="Subrayado" data-dojo-type="dijit/form/ToggleButton" data-dojo-attach-point="bSubr"data-dojo-attach-event="onChange:actualizarPreview""><u>S</u></button> 
		</div>
	</div>
	<div style="text-align:center; padding-top:10px;">
		<button id="Btn_Rotular" title="Rotular campo" class="Boton" data-dojo-attach-event="onclick:petDatos"><img id="imgRotulo" title="Rotular campo" src="${folderUrl}css/images/rotular.png"></button>
	</div>
	
	<div style="position:relative; text-align: right; padding-top: 12px;" id="idDiv">
	<span title="Limpiar rótulos de capa" class="claseBtnRojo" id="idLimpiar" data-dojo-attach-event="onclick:limpiarRotulosCapa">&nbsp;</span>
	<span title="Limpiar todos los rótulos" class="claseBtnRojo" id="idLimpiarTodo" data-dojo-attach-event="onclick:limpiarRotulos">&nbsp;</span>
	<span title="Exportar rótulos a Anotación de la capa seleccionada" class="claseBtnAzul" id="toAnnotation" data-dojo-attach-event="onclick:exportarAnotaciones">&nbsp;</span>
	</div>
  </div>
</div>
